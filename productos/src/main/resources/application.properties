spring.application.name=productos

# createDatabaseIfNotExist=true crea la base de datos si no existe.
spring.datasource.url=jdbc:mysql://localhost:3306/tienda_productos?createDatabaseIfNotExist=true

spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.properties.hibernate.format_sql=true

server.port=8083

# Para que los mensajes de error (ej: "Stock insuficiente") lleguen a React.
# En Spring Boot 4 es spring.web.error... (server.error.include-message ya no funciona).
spring.web.error.include-message=always

spring.flyway.enabled=true

spring.flyway.locations=classpath:db/migracion

# Eureka: se registra como "productos". Así lo encuentran el Gateway (lb://productos) y el microservicio de carrito.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
