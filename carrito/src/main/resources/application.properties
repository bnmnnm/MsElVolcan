# Nombre de la aplicación (el Gateway la busca en Eureka como lb://carrito).
spring.application.name=carrito

# Servidor: localhost. Puerto: 3306. Base de datos: tienda_carrito (se crea sola si no existe).
spring.datasource.url=jdbc:mysql://localhost:3306/tienda_carrito?createDatabaseIfNotExist=true

# Usuario para conectarse a MySQL (Laragon).
spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate solo valida; las tablas las crea Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# El microservicio estará disponible en http://localhost:8085.
server.port=8085

# Para que los mensajes de error (ej: "Stock insuficiente") lleguen a React.
spring.web.error.include-message=always

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migracion

# Eureka (también se usa para encontrar al microservicio de productos).
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
