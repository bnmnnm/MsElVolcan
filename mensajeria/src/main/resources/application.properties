spring.application.name=mensajeria

# createDatabaseIfNotExist=true crea la base de datos si no existe.
spring.datasource.url=jdbc:mysql://localhost:3306/tienda_mensajeria?createDatabaseIfNotExist=true

spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.properties.hibernate.format_sql=true

server.port=8082

# Para que los mensajes de error lleguen a React (Spring Boot 4).
spring.web.error.include-message=always

spring.flyway.enabled=true

spring.flyway.locations=classpath:db/migracion

# Eureka: se registra como "mensajeria". El Gateway lo encuentra con lb://mensajeria.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
