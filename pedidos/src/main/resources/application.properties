# Nombre de la aplicación.
spring.application.name=pedidos

# Servidor: localhost. Puerto: 3306. Base de datos: tienda_pedidos (se crea sola si no existe).
spring.datasource.url=jdbc:mysql://localhost:3306/tienda_pedidos?createDatabaseIfNotExist=true

# Usuario para conectarse a MySQL (Laragon).
spring.datasource.username=root
spring.datasource.password=

# Clase del controlador JDBC que permite conectarse con MySQL.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
# Valida que la estructura de las tablas coincida con las entidades.
# Hibernate no crea ni modifica tablas; esa tarea la realiza Flyway.
spring.jpa.hibernate.ddl-auto=validate

# Muestra en la consola las sentencias SQL ejecutadas por Hibernate.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# El microservicio estará disponible en http://localhost:8084.
server.port=8084

# Para que los mensajes de error (ej: "Stock insuficiente") lleguen a React.
# En Spring Boot 4 es spring.web.error... (server.error.include-message ya no funciona).
spring.web.error.include-message=always

# Habilita la ejecución de las migraciones pendientes al iniciar.
spring.flyway.enabled=true

# Corresponde a src/main/resources/db/migracion dentro del proyecto.
spring.flyway.locations=classpath:db/migracion

# Eureka: el microservicio se registra con el nombre de spring.application.name.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# Se registra con su IP (evita problemas con el nombre del equipo).
eureka.instance.prefer-ip-address=true
